<div class="home-container">
  <div class="chat-list">
      <app-chat-list (openSettingsEvent)="openSettings()" (openProfileEvent)="openProfile()" (logoutEvent)="openLogoutConfirm()"></app-chat-list>
  </div>
  <div class="chat-message-container">
      <app-chat-message-container></app-chat-message-container>
  </div>
</div>
<app-verify-email-pop [isOpen]="!verify">
</app-verify-email-pop>

<app-change-password *ngIf="isSettingsOpen" (close)="closeSettings()">
</app-change-password>

<app-user-profile *ngIf="isProfileOpen" (close)="closeProfile()" (openSettingsEvent)="openSettings()">
</app-user-profile>

<div class="modal-overlay" *ngIf="showLogoutConfirm">
  <div class="modal-content glass-panel">
    <h3>Confirm Logout</h3>
    <p>Are you sure you want to log out?</p>
    <div class="modal-actions">
      <button class="btn btn-secondary" (click)="cancelLogout()">Cancel</button>
      <button class="btn btn-danger" (click)="confirmLogout()">Log Out</button>
    </div>
  </div>
</div>
