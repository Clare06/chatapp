<div class="profile">
{{username}}
</div>

<div class="search">
  <input type="text" [(ngModel)]="searchQuery" placeholder="Search..." >

</div>

<div class="list">
  <div *ngFor="let friend of filteredFriends" (click)="textTo(friend)" [ngClass]="{active: activeFrien==friend}" style="display: flex; justify-content: space-between; align-items: center;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span class="presence-dot" [class.online]="(webSocketService.onlineFriends$ | async)?.has(friend)"></span>
      <strong>{{ friend }}</strong>
    </div>
    <div class="unread-badge" *ngIf="(webSocketService.unreadCounts$ | async)?.get(friend)">
      {{ (webSocketService.unreadCounts$ | async)?.get(friend) }}
    </div>
  </div>
  <div *ngIf="filteredFriends.length === 0" style="color: var(--text-secondary); text-align: center; padding: 20px;">
    No friends yet. Click the + button to add friends!
  </div>
</div>
<div class="add-friend" (click)="openPopup()">
  <a>
    <svg *ngIf="x == 0" xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3v-3z"/>
    </svg>
    <p *ngIf="x != 0">{{x}}</p>
  </a>
</div>
<div class="logout" (click)="logout()">
  <a>
    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" class="bi bi-power" viewBox="0 0 16 16">
      <path d="M7.5 1v7h1V1h-1z"/>
      <path d="M3 8.812a4.999 4.999 0 0 1 2.578-4.375l-.485-.874A6 6 0 1 0 11 3.616l-.501.865A5 5 0 1 1 3 8.812z"/>
    </svg>
  </a>
</div>
<div class="settings" (click)="openSettings()">
  <a>
    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="white" class="bi bi-gear-fill" viewBox="0 0 16 16">
      <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
    </svg>
  </a>
</div>

<div class="profile-btn-icon" (click)="openProfile()" style="position: absolute; bottom: 170px; left: 16px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #a855f7); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); z-index: 10;">
  <a>
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="white" class="bi bi-person-fill" viewBox="0 0 16 16">
      <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3Zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
    </svg>
  </a>
</div>

<app-friendpop [isOpen]="isPopupOpen" (close)="closePopup()" (friendReqs)="onFriendRequest($event)" >
</app-friendpop>
