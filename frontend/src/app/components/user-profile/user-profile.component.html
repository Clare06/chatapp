<div class="profile-container">
  <div class="profile-card">
    <button class="close-modal-btn" (click)="close.emit()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 24px; cursor: pointer; opacity: 0.6; transition: opacity 0.2s;">&times;</button>
    <div class="profile-header">
      <div class="avatar-circle">
        {{ profile.username ? profile.username.charAt(0).toUpperCase() : 'U' }}
      </div>
      <h2>{{ profile.username }}</h2>
      <p class="subtitle">{{ profile.email }}</p>
    </div>

    <div class="profile-body">
      <div class="msg success" *ngIf="successMsg">{{ successMsg }}</div>
      <div class="msg error" *ngIf="errorMsg">{{ errorMsg }}</div>

      <form (ngSubmit)="saveProfile()" #profileForm="ngForm">
        <div class="form-group">
          <label>User ID (Cannot be changed)</label>
          <input type="text" [value]="profile.userid" disabled class="input-disabled">
        </div>

        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" [(ngModel)]="profile.username" [disabled]="!isEditing" required minlength="3">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" name="email" [(ngModel)]="profile.email" [disabled]="!isEditing" required email>
        </div>

        <div class="actions">
          <button type="button" class="btn btn-secondary" *ngIf="!isEditing" (click)="toggleEdit()">Edit Profile</button>
          
          <ng-container *ngIf="isEditing">
            <button type="button" class="btn btn-cancel" (click)="toggleEdit()" [disabled]="isSaving">Cancel</button>
            <button type="submit" class="btn btn-primary" [disabled]="!profileForm.valid || isSaving">
              {{ isSaving ? 'Saving...' : 'Save Changes' }}
            </button>
          </ng-container>
        </div>
      </form>
    </div>
  </div>
</div>
